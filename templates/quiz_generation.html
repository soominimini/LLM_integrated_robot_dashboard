<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Educational Quiz Builder</title>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-80 bg-white border-r border-gray-200 p-6 flex flex-col gap-8 shadow-sm z-10">
            <div>
                <h2 class="text-xl font-bold text-indigo-700 mb-1">Quiz Builder</h2>
                <p class="text-xs text-gray-500 italic">Configure session parameters</p>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Question Type</label>
                <select id="typeSelect" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium">
                    <option value="yes_no">Yes / No</option>
                    <option value="wh">WH- Questions</option>
                    <option value="both" selected>Both</option>
                </select>
            </div>

            <div>
                <label for="countInput" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Number of Questions <span class="text-gray-400 font-medium normal-case">(type or use +/-, 1–100)</span></label>
                <div class="flex items-center justify-between bg-gray-50 p-1 rounded-lg border border-gray-200">
                    <button id="btnMinus" type="button" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-md text-xl font-bold text-gray-600 hover:bg-gray-100 active:scale-95 transition-all shadow-sm">-</button>
                    <input type="number" id="countInput" value="10" min="1" max="100" step="1" inputmode="numeric"
                           class="flex-1 mx-1 h-10 text-center font-bold text-lg bg-white border border-gray-300 rounded-md text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 cursor-text transition">
                    <button id="btnPlus" type="button" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-200 rounded-md text-xl font-bold text-gray-600 hover:bg-gray-100 active:scale-95 transition-all shadow-sm">+</button>
                </div>
            </div>

            <button id="btnGenerate" class="mt-auto w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all transform active:scale-[0.98]">
                Generate List
            </button>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gray-50 flex flex-col items-center">
            <div class="w-full max-w-3xl py-12 px-6">
                <div class="flex justify-between items-center mb-10 border-b border-gray-200 pb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Quiz Content</h1>
                        <p id="statusText" class="text-sm text-gray-500 italic">Adjust settings and click "Generate".</p>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnClear" class="px-4 py-2 bg-white border border-gray-200 text-xs font-bold rounded-lg hover:bg-gray-50 uppercase tracking-tight transition">Clear</button>
                        <button id="btnSave" class="px-4 py-2 bg-emerald-500 text-white text-xs font-bold rounded-lg hover:bg-emerald-600 uppercase tracking-tight transition shadow-sm">Save Quiz</button>
                    </div>
                </div>

                <div id="questionList" class="space-y-4">
                    <div id="emptyState" class="p-12 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 bg-white shadow-inner text-center">
                        <p class="text-sm font-medium">No questions generated yet.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. STATE MANAGEMENT
        // (Difficulty selection removed 2026-07-04 — the server derives the
        // target level from the logged-in child's profile age.)
        const countInput = document.getElementById('countInput');
        const questionList = document.getElementById('questionList');
        const emptyState = document.getElementById('emptyState');
        const statusText = document.getElementById('statusText');

        // 3. UI CONTROLS
        // Number of questions: type directly, or step with +/- (range 1–100).
        // getCount() is the single source of truth — always clamped — so the
        // generate handler is safe even if the field never fired a blur/change.
        const getCount = () => {
            const v = parseInt(countInput.value, 10);
            return isNaN(v) ? 1 : Math.min(100, Math.max(1, v));
        };
        const setCount = (v) => { countInput.value = Math.min(100, Math.max(1, v)); };
        document.getElementById('btnPlus').addEventListener('click', () => setCount(getCount() + 1));
        document.getElementById('btnMinus').addEventListener('click', () => setCount(getCount() - 1));
        // Select the whole value on focus so a click-and-type overwrites it.
        countInput.addEventListener('focus', () => countInput.select());
        // Clamp only when the user commits (blur / Enter), so mid-typing values
        // like "1" on the way to "12" aren't snapped away under the cursor.
        countInput.addEventListener('change', () => setCount(getCount()));
        countInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); setCount(getCount()); countInput.blur(); }
        });

        // 4. GENERATION LOGIC
        document.getElementById('btnGenerate').addEventListener('click', async () => {
            const typeSelect = document.getElementById('typeSelect').value;
            const count = getCount();
            setCount(count);  // reflect the clamped value back into the field

            const types = [];
            if (typeSelect === "yes_no") types.push("yes_no");
            if (typeSelect === "wh") types.push("wh");
            if (typeSelect === "both") types.push("yes_no", "wh");

            statusText.innerText = "Generating questions...";
            questionList.innerHTML = '';

            try {
                const res = await fetch('/api/generate_quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        count,
                        types
                    })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Generation failed');

                const questions = data.questions || [];
                if (!questions.length) {
                    questionList.appendChild(emptyState);
                    statusText.innerText = 'No questions generated.';
                    return;
                }

                statusText.innerText = `Generated ${questions.length} questions`;
                questions.forEach((q, i) => {
                    const typeLabel = (q.type === "yes_no") ? "Yes/No" : "WH- Question";
                    const answerLabel = q.open_ended ? "OPEN-ENDED"
                        : (q.correct_answer ? q.correct_answer.toUpperCase() : "N/A");
                    const socialChip = q.social_target
                        ? `<span class="text-[10px] font-bold uppercase text-purple-500">${q.social_target.replace(/_/g, ' ')}</span>`
                        : '';
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex gap-4 group animate-fade-in";
                    card.dataset.type = q.type;
                    card.dataset.answer = q.correct_answer || "";
                    card.dataset.acceptedAnswers = JSON.stringify(q.accepted_answers || []);
                    card.dataset.openEnded = q.open_ended ? "1" : "";
                    card.dataset.socialTarget = q.social_target || "";
                    card.innerHTML = `
                        <div class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0">${i + 1}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-black uppercase text-indigo-400">${typeLabel} • age ${data.target_age ?? ''}</span>
                                ${socialChip}
                                <span class="text-[10px] font-bold uppercase text-emerald-600">Answer: ${answerLabel}</span>
                                <button onclick="this.closest('.group').remove()" class="text-gray-300 hover:text-red-500 text-xs transition">Delete</button>
                            </div>
                            <input type="text" value="${q.question}"
                                   class="w-full font-medium text-gray-800 focus:outline-none focus:border-b focus:border-indigo-300 pb-1 bg-transparent">
                        </div>
                    `;
                    questionList.appendChild(card);
                });
            } catch (e) {
                statusText.innerText = "Generation failed.";
                questionList.appendChild(emptyState);
                alert(e.message);
            }
        });

        // Save Quiz
        document.getElementById('btnSave').addEventListener('click', async () => {
            const cards = questionList.querySelectorAll('[data-type]');
            if (!cards.length) {
                alert("No questions to save.");
                return;
            }
            const questions = Array.from(cards).map(card => {
                const entry = {
                    question: card.querySelector('input[type="text"]').value.trim(),
                    type: card.dataset.type,
                    correct_answer: card.dataset.answer
                };
                if (card.dataset.acceptedAnswers) {
                    try { entry.accepted_answers = JSON.parse(card.dataset.acceptedAnswers); } catch(e) {}
                }
                // Carry grading + coverage metadata through save: the play page
                // grades open-ended questions accept-any, and social_target
                // records which social-communication target a question covers.
                if (card.dataset.openEnded) entry.open_ended = true;
                if (card.dataset.socialTarget) entry.social_target = card.dataset.socialTarget;
                return entry;
            }).filter(q => q.question);

            try {
                const res = await fetch('/api/save_quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ questions })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Save failed');
                statusText.innerText = `Quiz saved (${data.yes_no_count} yes/no, ${data.wh_count} wh- questions).`;
            } catch (e) {
                alert("Save failed: " + e.message);
            }
        });

        // Clear All
        document.getElementById('btnClear').addEventListener('click', () => {
            questionList.innerHTML = '';
            questionList.appendChild(emptyState);
            statusText.innerText = 'Adjust settings and click "Generate".';
        });
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
        /* Hide number input arrows */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</body>
</html>
