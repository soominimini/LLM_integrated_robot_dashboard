<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene Detection - Play</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial; background: #f5f7fb; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .header { display:flex; align-items:center; justify-content:space-between; }
    .title { font-size: 20px; color:#334155; margin:0; }
    .btn { background:#667eea; color:#fff; border:0; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn.secondary { background:#6c757d; }
    .question { background:#eef2ff; color:#3730a3; padding:12px; border-radius:10px; margin:12px 0; font-weight:700; text-align:center; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:12px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; cursor:pointer; transition: box-shadow .2s; }
    .card:hover { box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
    .card img { width:100%; height:140px; object-fit:cover; display:block; }
    .caption { padding:8px; font-size:14px; color:#475569; text-transform:capitalize; text-align:center; }
    .status { margin-top:10px; font-size:14px; color:#64748b; text-align:center; }
    .mode-picker { display:flex; gap:8px; justify-content:center; margin:10px 0; }
    .mode-btn { background:#e2e8f0; color:#334155; border:0; padding:8px 14px;
                border-radius:18px; cursor:pointer; font-weight:600; font-size:13px; }
    .mode-btn.active { background:#667eea; color:#fff; }

    /* Live camera preview — shows the real-time angle the robot sees */
    .camera-wrap { margin:12px 0; text-align:center; }
    .camera-wrap img { width:100%; max-width:520px; border-radius:12px;
                       border:2px solid #cbd5e1; background:#000;
                       aspect-ratio:4/3; object-fit:contain; }
    .camera-wrap .cam-label { font-size:12px; color:#64748b; margin-top:4px; }
    .cam-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
               background:#ef4444; margin-right:5px; vertical-align:middle;
               animation: camblink 1s infinite; }
    @keyframes camblink { 50% { opacity:0.25; } }

    /* Gemini inference panel — what the model saw, was asked, and answered */
    .inference { display:none; margin-top:16px; background:#fff;
                 border:1px solid #e5e7eb; border-radius:12px; padding:14px; }
    .inference h3 { margin:0 0 10px; font-size:15px; color:#334155; }
    .inference .infgrid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    @media (max-width:680px){ .inference .infgrid { grid-template-columns:1fr; } }
    .inference img, .inference video { width:100%; border-radius:8px;
                 border:1px solid #e5e7eb; background:#000; display:block; }
    .verdict { font-weight:700; padding:6px 10px; border-radius:8px;
               display:inline-block; margin-bottom:8px; }
    .verdict.ok { background:#dcfce7; color:#166534; }
    .verdict.no { background:#fee2e2; color:#991b1b; }
    .verdict.unk { background:#fef9c3; color:#854d0e; }
    .kv { font-size:13px; color:#475569; margin:3px 0; }
    .kv b { color:#334155; }
    .codebox { background:#0f172a; color:#e2e8f0; font-family:ui-monospace,
               SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
               white-space:pre-wrap; word-break:break-word; padding:10px;
               border-radius:8px; max-height:240px; overflow:auto; margin:4px 0; }
    .inference details { margin-top:8px; }
    .inference summary { cursor:pointer; font-size:13px; color:#667eea;
                         font-weight:600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title"> Scene Detection</h1>
      <div>
        <button class="btn secondary" onclick="back()">Back</button>
        <button id="newRoundBtn" class="btn">Start</button>
        <button id="hintBtn" class="btn" style="background:#f59e0b;">Hint</button>
        <button id="captureBtn" class="btn">Capture Scene</button>
      </div>
    </div>
    <div class="mode-picker" title="Choose the round style for the next 'Start' click">
      <button class="mode-btn active" data-mode="auto">Auto (by age)</button>
      <button class="mode-btn" data-mode="criteria">Criteria</button>
      <button class="mode-btn" data-mode="direction">Direction</button>
    </div>
    <div id="question" class="question">Click "New Round" to start</div>

    <!-- Live camera feed: see the real-time angle the robot's camera sees -->
    <div class="camera-wrap">
      <img id="camera-frame" alt="Live camera feed" />
      <div class="cam-label"><span class="cam-dot"></span>Live camera — check the angle before capturing</div>
    </div>

    <div id="cards" class="grid" style="display:none"></div>
    <div id="status" class="status"></div>
  </div>

  <script>
    const $q = document.getElementById('question');
    const $cards = document.getElementById('cards');
    const $status = document.getElementById('status');
    const $new = document.getElementById('newRoundBtn');
    const $cap = document.getElementById('captureBtn');

    // Current round state
    window.roundMode = null;     // "exact" | "criteria" | "direction"
    window.currentTarget = null; // toy name (exact mode)
    window.currentCriteria = null; // criteria string (criteria mode)
    window.currentObjA = null;   // moving object (direction mode)
    window.currentObjB = null;   // reference object (direction mode)
    window.currentRelation = null; // canonical relation key (direction mode)
    window.requestedMode = 'auto'; // mode-picker selection for next Start

    // Relations that the server records as a short video instead of a still —
    // keep this in sync with VIDEO_DEPTH_RELATIONS on the server.
    // (Depth: behind/in_front_of. Containment: in/out — for ages <=3.)
    // Declared here, before the click handlers below are wired up, so it is
    // never read while still in the temporal dead zone (a click on Capture
    // could otherwise fire captureAndValidate before the old declaration ran).
    const VIDEO_DEPTH_RELATIONS = new Set(['behind', 'in_front_of', 'in', 'out']);

    const $hint = document.getElementById('hintBtn');

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.requestedMode = btn.dataset.mode;
      };
    });

    $new.onclick = startRound;
    $cap.onclick = captureAndValidate;
    $hint.onclick = getHint;
    startCamera();

    async function startRound() {
      try {
        $status.textContent = 'Starting...';
        const res = await fetch('/api/scene/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: window.requestedMode || 'auto' })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to start');
        window.roundMode = data.mode || 'exact';
        window.currentTarget = data.target || null;
        window.currentCriteria = data.criteria || null;
        window.currentObjA = data.obj_a || null;
        window.currentObjB = data.obj_b || null;
        window.currentRelation = data.relation || null;
        $q.textContent = data.question || 'Show me an object!';
        if (window.roundMode === 'direction') {
          $status.textContent = 'Arrange the objects in front of the camera, then click "Capture Scene".';
        } else {
          $status.textContent = 'Show the object to the camera and click "Capture Scene"!';
        }
      } catch (e) {
        $status.textContent = 'Error: ' + e.message;
      }
    }

    async function captureAndValidate() {
      if (!window.roundMode) {
        $status.textContent = 'Click "Start" first to begin a round.';
        return;
      }
      try {
        if (window.roundMode === 'direction' && VIDEO_DEPTH_RELATIONS.has(window.currentRelation)) {
          $status.textContent = 'Recording 3 seconds — hold the objects steady and tilt them slightly so I can see depth.';
        } else {
          $status.textContent = 'Analyzing...';
        }
        const body = {
          mode: window.roundMode,
          target: window.currentTarget,
          criteria: window.currentCriteria,
          obj_a: window.currentObjA,
          obj_b: window.currentObjB,
          relation: window.currentRelation,
        };
        const res = await fetch('/api/scene_game/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!data.success) {
          $status.textContent = 'Error: ' + (data.error || 'Unknown');
          return;
        }
        renderInference(data);
        if (data.correct === null) {
          $status.textContent = 'Could not see clearly. Try again!';
        } else if (window.roundMode === 'direction') {
          // Direction-mode result includes obj presence + the relation Gemini
          // actually saw. Surface both so the therapist can debug mistakes.
          const reason = data.reason ? ' — ' + data.reason : '';
          if (data.correct) {
            $status.textContent = 'Correct!' + reason;
          } else if (!data.obj_a_found || !data.obj_b_found) {
            const missing = !data.obj_a_found ? data.obj_a : data.obj_b;
            $status.textContent = `I can't see the ${missing}. Try again!` + reason;
          } else {
            $status.textContent = `Not quite — I see "${data.actual_relation}". Try again!` + reason;
          }
        } else if (data.correct) {
          const det = data.detected || 'that';
          $status.textContent = 'Correct! Detected: ' + det + (data.reason ? ' — ' + data.reason : '');
        } else {
          const det = data.detected || 'that';
          $status.textContent = 'Not quite! Detected: ' + det + (data.reason ? ' — ' + data.reason : '') + '. Try again!';
        }
      } catch (e) {
        $status.textContent = 'Error: ' + e.message;
      }
    }

    async function getHint() {
      if (!window.roundMode) {
        $status.textContent = 'Click "Start" first to begin a round.';
        return;
      }
      try {
        $status.textContent = 'Thinking of a hint...';
        const body = {
          mode: window.roundMode,
          target: window.currentTarget,
          criteria: window.currentCriteria,
          obj_a: window.currentObjA,
          obj_b: window.currentObjB,
          relation: window.currentRelation,
        };
        const res = await fetch('/api/scene_game/hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          $status.textContent = 'Hint: ' + data.hint;
        } else {
          $status.textContent = 'Could not generate hint.';
        }
      } catch (e) {
        $status.textContent = 'Error: ' + e.message;
      }
    }

    function back() { window.location.href = '/play'; }

    // The "How Gemini decided" panel was removed from the visible page. We
    // still want this debug detail when running locally, so log it to the
    // browser console (open DevTools to inspect). Only direction mode returns
    // these fields; for other modes there is nothing to log.
    function renderInference(data) {
      if (!data || (!data.image_url && !data.video_url && !data.prompt)) return;
      const instr = (data.obj_a && data.obj_b)
        ? `Put the ${data.obj_a} (${data.relation}) the ${data.obj_b}` : '—';
      const verdict = data.correct === true ? '✓ Correct'
        : data.correct === false ? '✗ Not quite' : '? Unclear';
      console.groupCollapsed('🔎 How Gemini decided —', verdict);
      console.log('Instruction:', instr);
      console.log('Gemini saw relation:', data.actual_relation || '—');
      console.log('Objects found:',
        `${data.obj_a || 'obj A'}: ${data.obj_a_found ? 'yes' : 'no'}, ` +
        `${data.obj_b || 'obj B'}: ${data.obj_b_found ? 'yes' : 'no'}`);
      console.log('Reason:', data.reason || '—');
      if (data.video_url) console.log('Clip:', data.video_url);
      if (data.image_url) console.log('Frame:', data.image_url);
      console.log('Prompt sent to Gemini:', data.prompt || '(not available)');
      console.log('Gemini raw response:', data.raw_response || '(not available)');
      console.groupEnd();
    }

    // Live camera preview — poll the single-frame endpoint for a near-real-time
    // view (the dev server is single-threaded, so MJPEG streaming would block
    // every other request; rapid polling keeps the UI responsive).
    let camTimer = null;
    function startCamera() {
      const img = document.getElementById('camera-frame');
      if (!img) return;
      const tick = () => {
        const next = new Image();
        next.onload = () => { img.src = next.src; };
        next.src = '/api/camera_frame?t=' + Date.now();
      };
      tick();
      camTimer = setInterval(tick, 300);
    }
    function stopCamera() { if (camTimer) { clearInterval(camTimer); camTimer = null; } }
  </script>
</body>
</html>
